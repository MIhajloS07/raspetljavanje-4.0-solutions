<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="240" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="900" height="240" fill="url(#bg)"/>
    <g>
      <path fill="url(#wave)" d="M0 170 Q 112 130 225 170 T 450 170 T 675 170 T 900 170 T 1125 170 T 1350 170 V240 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="9s" repeatCount="indefinite"/>
      </path>
      <path fill="url(#wave)" opacity="0.6" d="M0 190 Q 112 150 225 190 T 450 190 T 675 190 T 900 190 T 1125 190 T 1350 190 V240 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="-450 0" to="0 0" dur="13s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="#ffffff" opacity="0.8">
      <circle cx="120" cy="50" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="40" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="90" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="30" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
    </g>
    <text x="450" y="100" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff" opacity="0">
      rasPETLJAvanje 4.0
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" dur="1.2s" fill="freeze"/>
    </text>
    <text x="450" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" fill="#7dd3fc" opacity="0">
      my Python &amp; Pygame solutions
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="1.2s" fill="freeze"/>
    </text>
    <rect x="618" y="122" width="12" height="22" fill="#7dd3fc">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
