<svg xmlns="http://www.w3.org/2000/svg" width="800" height="110" viewBox="0 0 800 110" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="800" height="110" rx="14" fill="url(#g)"/>
  <rect width="800" height="110" rx="14" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="12 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="4s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(70 55)">
    <polygon points="0,-30 9,-10 31,-8 14,7 19,29 0,18 -19,29 -14,7 -31,-8 -9,-10" fill="#fde047">
      <animateTransform attributeName="transform" type="scale" values="1;1.15;1" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="-8;8;-8" dur="4s" repeatCount="indefinite"/>
    </polygon>
  </g>
  <text x="130" y="50" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Most Active Participant</text>
  <text x="130" y="78" font-family="'Courier New', monospace" font-size="17" fill="#fde68a">rasPETLJAvanje 4.0 · Petlja Foundation</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
