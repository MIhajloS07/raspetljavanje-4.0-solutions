<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="800" height="160" rx="14" fill="#0f172a"/>
  <g transform="translate(700 80)">
    <circle r="50" fill="#ef4444"/>
    <circle r="36" fill="#f8fafc"/>
    <circle r="22" fill="#ef4444"/>
    <circle r="9" fill="#f8fafc"/>
    <circle r="50" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0">
      <animate attributeName="r" values="50;78" dur="3s" repeatCount="indefinite" keyTimes="0;1"/>
      <animate attributeName="opacity" values="0;0;0.9;0" keyTimes="0;0.55;0.6;1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <rect x="0" y="76" width="28" height="8" rx="4" fill="#38bdf8"/>
    <polygon points="28,74 40,80 28,86" fill="#e0f2fe"/>
    <animateTransform attributeName="transform" type="translate" values="40 0; 640 0; 640 0" keyTimes="0;0.55;1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.55;0.6;1" dur="3s" repeatCount="indefinite"/>
  </g>
  <text x="30" y="140" font-family="'Courier New', monospace" font-size="14" fill="#94a3b8">bullet.x += speed  # hit!</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
